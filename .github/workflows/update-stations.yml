name: Update station list

# Refreshes public/stations-de.json from OpenStreetMap every Monday,
# commits it to the default branch and redeploys the site.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download stations from OpenStreetMap
        run: node scripts/fetch-stations.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/stations-de.json && git ls-files --error-unmatch public/stations-de.json >/dev/null 2>&1; then
            echo "No changes"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stations-de.json
          git commit -m "data: update station list from OpenStreetMap"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
